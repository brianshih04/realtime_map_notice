services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  location-service:
    build:
      context: .
      dockerfile: backend/location-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8001:8000"
    depends_on:
      - redis

  event-service:
    build:
      context: .
      dockerfile: backend/event-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8002-8004:8000"
    deploy:
      replicas: 3
    depends_on:
      - redis
      - notification-service

  notification-service:
    build:
      context: .
      dockerfile: backend/notification-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8011-8013:8000" # 避開 8003 衝突，改用 8011 到 8013
    deploy:
      replicas: 3
    depends_on:
      - redis
