name: Deploy Status

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev, dev_K8s]

jobs:
  notify:
    name: Deploy Signal
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deployment triggered
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "✅ CI passed on $BRANCH ($SHA)"
          echo "🚀 DGX cron will auto-deploy within 2 minutes"
